server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Revalidate the entry point and service worker when a new image is deployed.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Vite gives these files content hashes, including the Worker and WASM.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
